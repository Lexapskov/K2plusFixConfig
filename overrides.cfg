#нижеследующие строки меняют параметры принтера на оптимизированные при загрузке принтера
# из printer.cfg
[stepper_y]
position_max: 384 # 400по заводу , но это уже сильно за стеной какосброса, можно определить стрелками с экранчика после выполнения макроса NOZZLE_CLEANPARKING

[prtouch_v3]
samples: 2 #1 увеличил число образцов для определения Z-offset
samples_tolerance: 0.01 #0.5 допустимую ошибку определения Z-offset назначим 1 сотую вместо полумиллиметра
prth_msg_show: False #True спам в консоль от тензодатчика
[virtual_sdcard]
forced_leveling: false #true полностью отключаем автокартирование для каждой печати
[bed_mesh]
speed: 500 #100 ускоряем холостые перемещения при снятии карты стола

[box]
pre_cut_pos_y: 300 #200 исходная препозиция для резки филамента, 300 чтоб не ездил далеко от какосброса
cut_pos_y: 300 #200 позиция для резки филамента значение лучше ставить равным препозиции и не у самого края, чтоб вал мог "отыграть" удар
safe_pos_x: 175 #225 ближе к центру зоны протирки на pei-пластие, 175 ближе к какосбросу -точные координаты своего принтера смотрите двигая голову стрелками на экранчике(можно поставить напротив латунной щётки)
safe_pos_y: 348 #345 позаводу (350 делать нельзя т.к. точка иногда используется и при смене филамента)
clean_left_pos_y: 376 #378 по заводу  376 мой центр пружинки
clean_left_pos_x: 156 #135 у меня установлена координата левого края щётки чтоб при заводской чистке пластинку по реже ломало
clean_right_pos_x: 179 #160 по заводу. Правый край сопельной щётки (поставьте значение 162, если вы не устанавливали к штатной резиновой дополнительную латунную)

[extruder]
pressure_advance: 0.042
pressure_advance_smooth_time: 0.02 #0.038 милисек время рекации для pressure_advance, чем меньше тем больше нагрузка на операционную систему и экструдер, но короче участки срабатывания корректировки, но для длинного горла слишком короткое ыьщщер time приводит к тому что кусок филамента работает как пружина, особенно в спецефических горлах уникорн с их длинными конусами вместо цилиндрических отверстий.

#из printer_param.cfg
[custom_macro]
default_bed_temp: 70 #50 температура стола "по умолчанию" для картирования стола и зануления
default_extruder_temp: 230 #220 температура сопла "по умолчанию" для очистки сопла 


#вот это надо скопировать и цело вставить в конец gcode_macro.cfg потомучто без этого переопределения прошивка тупит сохраняя с перезагрузкой PID или карту стола запущенную из fluidd
[gcode_macro SAVE_CONFIG]
rename_existing: SAVE_CONFIG_BASE  # просто переопределяем оригинальную команду
gcode:
    {action_respond_info("Nozzle heatpiderasting")}
    SAVE_CONFIG_BASE               # Вызываем оригинальную встроенную команду
    {action_respond_info("Configuration saved, restarting...")}



# нижеследующие макросы после обновления прошивки придётся руками сравнивать на необходимость переносов в gcodemacro.cfg
[gcode_macro START_PRINT] # Основной макрос начала печати
variable_prepare: 0 # Переменная для отслеживания состояния подготовки (0 - не готово, 1 - готово)
gcode:
  # ВКЛЮЧАЕМ ВЕНТИЛЯТОР КАМЕРЫ, ЕСЛИ задана ТЕМПЕРАТУРА > 40°C
  {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %} # получаем значение если оно передано из слайсера
  {% if chamber_temp > 40 %}
    M106 P1 S255 F1
    {action_respond_info("Chamber fan ON (set temp %s )" % (chamber_temp))}
  {% else %}
    M106 P1 S0 F1
    {action_respond_info("Chamber fan OFF (set temp <= 40°C)")}
  {% endif %}
  M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
  M140 S{params.BED_TEMP} # Установка температуры стола (без ожидания)
  BOX_START_PRINT # Связь с CFS протяжка прутка... вроде
  G90 # Установка абсолютного позиционирования
  SET_GCODE_OFFSET Z=0 # Сброс смещения по оси Z
  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %} # Температура сопла для G28 из пользовательских настроек
  {% set bed_temp = printer.custom_macro.default_bed_temp %} # Температура стола по умолчанию
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %} # Температура сопла по умолчанию
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %} # Температура стола из параметров (по умолчанию 60°C)
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %} # Температура сопла из параметров (по умолчанию 220°C)
  {% set EXTRUDER_WAITTEMP = (140.0|float)|int %} # Фиксированная промежуточная температура 140°C для предварительного нагрева
  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %} # Если подготовка ещё не выполнена
    {action_respond_info("print params prepared 111")} # Отправка информационного сообщения в интерфейс
    
    M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
    M140 S{params.BED_TEMP} # Установка температуры стола (без ожидания)
    M104 S{EXTRUDER_WAITTEMP} # Установка промежуточной температуры сопла 140°C (без ожидания)
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000 # Ограничение ускорения и замедления до 5000 мм/с²
    G28 # Выполнение полной гоминга (все оси в нулевую позицию)
    #NOZZLE_CLEAR # грубая Очистка сопла от остатков пластика об стол
    M104 S{EXTRUDER_WAITTEMP} # Повторная установка промежуточной температуры 140°C
    M190 S{params.BED_TEMP} # Ожидание достижения температуры стола
    M109 S{EXTRUDER_WAITTEMP} # Ожидание достижения промежуточной температуры сопла 140°C
    BOX_NOZZLE_CLEANFINE # очистка сопла и стряхивание какушек
    ZOFFSET_NOZZLE_CLEAR # очистка сопла с охлаждением уперевшись в пластину
    #NEXT_HOMEZ_NACCU # Точная калибровка оси Z с датчиком
    G28 Z # Повторная гоминг оси Z для точной установки нуля
  {% else %} # Иначе (если подготовка уже выполнена)
    PRINT_PREPARE_CLEAR # Очистка состояния подготовки для повторного использования
  {% endif %} # Конец условия проверки подготовки
  M140 S{params.BED_TEMP} # Установка финальной температуры стола
  M104 S{params.EXTRUDER_TEMP} # Установка финальной температуры сопла (рабочей)
  M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
  BOX_GO_TO_EXTRUDE_POS # Перемещение в позицию для выдавливания
  M190 S{params.BED_TEMP} # Ожидание достижения финальной температуры стола
  M109 S{params.EXTRUDER_TEMP} # Ожидание достижения финальной температуры сопла
  M220 S100 # Сброс множителя скорости подачи до 100%
  # M221 S100 # Сброс множителя потока (закомментировано)
  G21 # Установка единиц измерения в миллиметры (безопасность)
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10 # Ограничение скорости прохождения углов до 10 мм/с
  M204 S5000 # Установка ускорения по умолчанию 5000 мм/с²
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000 # Ограничение замедления до 5000 мм/с²
  BOX_NOZZLE_CLEANFINE # Повторная очистка сопла перед началом печати
  G92 E0 # Сброс счётчика экструдера (обнуление длины филамента)
  SET_PIN PIN=extruder_fan VALUE=1 # Включение вентилятора радиатора хотэнда
  #SET_TEMPERATURE_FAN_SWITCH TEMPERATURE_FAN=chamber_fan VALUE=1 # Включение вентилятора камеры (закомментировано)
  BED_MESH_TLOAD BED_TEMP={params.BED_TEMP}  # ВЫЗОВ МАКРОСА для выбора карты стола по его температуре
  SET_GCODE_OFFSET Z=0.01 MOVE=1 # Установка микросмещения по Z

[gcode_macro END_PRINT]
gcode:
  G91
  G1 E-0.6 F5400
  G1 Z2 Y2 F3600
  G90
  BOX_GO_TO_EXTRUDE_POS 
  #END_PRINT_Z_SAFE
  BOX_NOZZLE_CLEAN
  G92 E-2.4 F600
  RESTORE_LIMITS
  #END_PRINT_POINT #стол опускается до середины камеры
  ENABLE_PRESSURE_ADVANCE VALUE=1
  M400
  BOX_END #втягивание филамента
  BOX_END_PRINT #втягивание филамента
  Qmode_exit
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  M220 S100 # множитель скорости печати на 100%
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  BOX_GO_TO_EXTRUDE_POS #паркуемся в лоток
  M106 P0 S127 F1 #дуем на сопло
  #WAIT_TEMP_START
  NOZZLE_CLEANPARKING #очистка c парковкой на пружинке
  HEATBED_GETLOWZ_SAFE #опускаем стол до 300мм или ниже
  M106 P0 S0 F1 #выключаем обдув сопла


[gcode_macro END_PRINT_Z_SAFE] # опускаем стол почти в самый низ
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    G91
    {action_respond_info("END_PRINT_Z_SAFE act_z:%s, max_z:%s \n" % (act_z, max_z))}
    {% if act_z < (max_z - 5) %}
        {action_respond_info("END_PRINT_Z_SAFE G1 Z2.0 F1800 \n")}
        G1 Z2.0 F1800 #600
        BOX_GO_TO_EXTRUDE_POS
    {% endif %}
    G90
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro BED_MESH_TLOAD]
description: Загрузка профиля стола в зависимости от температуры
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    
    # Определяем профиль
    {% if BED_TEMP >= 90 %}
        {% set PROFILE = "100degrees" %}
    {% elif BED_TEMP >= 80 and BED_TEMP < 90 %}
        {% set PROFILE = "80degrees" %}
    {% else %}
        {% set PROFILE = "default" %}
    {% endif %}
    
    # Проверяем, существует ли профиль (подавляем ошибку, если нет)
    {% set PROFILES = printer.bed_mesh.profiles %}
    {% if PROFILE in PROFILES %}
        BED_MESH_PROFILE LOAD={PROFILE}
         {action_respond_info("Bedmesh: {PROFILE} loaded for: {BED_TEMP}C")}
    {% else %}
        RESPOND TYPE=command MSG="⚠️ Профиль {PROFILE} не найден! Используется калибровка по умолчанию."
        # Опционально: выполнить калибровку вместо загрузки
        # BED_MESH_CALIBRATE
    {% endif %}


# макрос на основе совета от Zz
[gcode_macro BOX_NOZZLE_CLEANPLUS] # Очистка сопла о латунную щетку
#rename_existing: BOX_NOZZLE_CLEAN # Переименовываем заводской макрос
gcode:
   BOX_GO_TO_EXTRUDE_POS # Перемещаем голову в какульник
   G0 X175 Y376 F10000 # Быстрое перемещение в центр чистящей щётки #координаты определять стрелочками с экранчика после макроса BOX_NOZZLE_CLEANPARKING
   {% for BrushingRounds in range(4) %} # Цикл очистки из 4 повторений
     G2 J4 F9000 # Дуга по часовой стрелке радиусом 6мм (очистка правой стороны)
     G3 J-4 F9000 # Дуга против часовой стрелки радиусом 6мм (очистка левой стороны)
     G3 I-3 F12000 # Дуга против часовой стрелки со смещением центра влево на 6мм
     G2 I3 F12000 # Дуга по часовой стрелке со смещением центра вправо на 6мм
   {% endfor %} # Конец цикла очистки
   BOX_NOZZLE_CLEAN # Вызов заводской процедуры быстрой очистки для сброса какушек и завершения в типичных для завода координатах

#переопределение штатного макроса по совету Zz
[gcode_macro ZOFFSET_NOZZLE_CLEAR]
description: замена штатной NOZZLE_CLEAR с агрессивным трением о стол в рамках подготовки сопла к занулению
#rename_existing: NOZZLE_CLEAR # переименовываем штатную агрессивную очистку
gcode:
 SAVE_GCODE_STATE NAME=myMoveState # Сохраняем текущее состояние позиции и экструдера
 BOX_GO_TO_EXTRUDE_POS # Перемещаем голову в стартовую позицию для выдавливания
 FILAMENT_RACK_SAVE_FAN # Сохраняем текущее состояние вентилятора
 FILAMENT_RACK_PRE_FLUSH # Выполняем предварительную продувку/прочистку филамента
 FILAMENT_RACK_SET_TEMP # Устанавливаем температуру для филамента
 SET_PIN PIN=fan0 VALUE=128 # Устанавливаем обороты вентилятора обдува на 50% (128/255)
 TEMP={EXTRUDER_TEMP} # Устанавливаем целевую температуру сопла
 SET_COOL_TEMP # Устанавливаем температуру охлаждения
 BOX_NOZZLE_CLEANPLUS # Очистка сопла о латунную щетку
 BOX_MOVE_TO_SAFE_POS # Быстрое перемещение на гладкий участок пеи пластины
 G0 Z-0.2 F1000 # Прижимаем сопло к столу с умеренной скоростью
 SET_PIN PIN=fan0 VALUE=255 # Включаем вентилятор на полную мощность (100%)
 M109 S{EXTRUDER_WAITTEMP} # Ждём достижения рабочей температуры сопла
 G0 Z5 F1000 # Поднимаем сопло на 5 мм для безопасного движения
 SET_PIN PIN=fan0 VALUE=0 # Выключаем вентилятор обдува
 FILAMENT_RACK_RESTORE_FAN # Восстанавливаем сохранённое состояние вентилятора
 BOX_MOVE_TO_SAFE_POS # Перемещаем голову в безопасную парковочную позицию
 RESTORE_GCODE_STATE NAME=myMoveState # Восстанавливаем исходное состояние позиции и экструдера


# Если вам нужен расчет и применение Z-offset на основе температуры, усадки материала и толщины первого слоя
# В слайсере/настройки принтера самый конец стартового G-коде добавьте: SET_ZOFFSET FIRST_LAYER_HEIGHT=[first_layer_height] FILAMENT_SHRINK=[filament_shrink] NOZZLE_TEMPERATURE_INITIAL_LAYER=[nozzle_temperature_initial_layer]
[gcode_macro SET_ZOFFSET]
description: Установка Z offset с учетом усадки материала
gcode:
    # Получаем параметры из слайсера
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.2)|float %}
    {% set filament_shrink_raw = params.FILAMENT_SHRINK|default("0") %}
    {% set nozzle_temp = params.NOZZLE_TEMPERATURE_INITIAL_LAYER|default(220)|float %}
    
    {% set filament_shrink = filament_shrink_raw|replace("%", "")|float %} # Очищаем от символа % и преобразуем в число
    {% set shrink_factor = (100.8 - filament_shrink) %} # Рассчитываем коэффициент усадки
    {% set z_offset = first_layer_height * shrink_factor * (nozzle_temp - 140) * 0.00167 %}  # Рассчитываем компенсацию Z offset
    {% set z_offset = (z_offset / 0.005)|round(0) * 0.005 %}  # Округляем до ближайшего шага 0.005
    
    # Устанавливаем Z-offset только если значение > 0
    {% if z_offset > 0 %}
        SET_GCODE_OFFSET Z={z_offset} MOVE=1
        RESPOND MSG=" Z-OFFSET: {z_offset} по усадке и температуре УСТАНОВЛЕН "
        M117 Z-Offset: {z_offset}mm
    {% else %}
        { action_respond_info(" {0} * {1} * {2} = {3} мм | Z-Offset НЕ УСТАНОВЛЕН (значение <= 0)".format(first_layer_height, shrink_factor, nozzle_temp * 0.01, z_offset)) }
    {% endif %}
# ALT_Z_OFFSET T=params.NOZZLE_TEMPERATURE_INITIAL_LAYER # раскомментируйте(уберите значок # в самом начале строки) эту строку, чтобы использовать Альтернативный вариант
# Расчет и применение Z-offset на основе температуры и примерной оценки состояния сопла, если вышеизложенные корректировки не подходит
[gcode_macro ALT_Z_OFFSET]
description: Nozzle temperature based Z-offset
gcode:
    {% set plotnost_vstavki = 8 %} #оценка плотности посадки твердой вставки в медном уникорне при разогреве сопла, определяется эмпирически чем хуже состояние вставки тем меньше значение 10-0 (можно использовать и отрицательные, но это повод заменить сопло или проверить надежность креплений
    {% set T = params.T|default(0)|float %}
  {% if T == 0 %}
        RESPOND MSG="ALT_Z_OFFSET: Нет данных о температуре сопла" # Если температура не передана или 0 - выходим
  {% else %}
      {% set delta_L = 0.0006706 * (T - 140) - plotnost_vstavki * 0.006 %}       # Рассчитываем удлинение по формуле ΔL = 0.0006706 * (T - 140)
      {% set z_offset = delta_L | round(2) %}     # Округляем до 2х знаков после запятой
      {% if z_offset > 0 %} # Если значение положительное - применяем
        SET_GCODE_OFFSET Z={z_offset} MOVE=1
        RESPOND MSG="установлен Z-offset: {z_offset} мм для {T}°C по люфту"
      {% else %}
        RESPOND MSG="Z-offset не изменился"
      {% endif %}
  {% endif %}


#нижеследующие макросы кастомные, с ними делать ничего не надо, можно просто использовать вызывая из консоли флюидд

[gcode_macro BED_MESH_80]
description: картирование стола и сохранение с температурой 80
gcode:
  M140 S80
  {% if 'PROBE_COUNT' in params|upper %}
    {% set get_count = ('PROBE_COUNT' + params.PROBE_COUNT) %}
  {%else %}
    {% set get_count = "" %}
  {% endif %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set nozzle_clear_temp = printer.custom_macro.default_extruder_temp %}
  {% if 'EXTRUDER_TEMP' in params|upper %}
    {% set nozzle_clear_temp = params.EXTRUDER_TEMP %}
  {% endif %}
  {% set enabled = printer["filament_switch_sensor filament_sensor"].enabled %}
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  M104 S{extruder_temp}
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
# Здесь для возврата в исходное положение необходимо опустить ось Z. После этой фотоэлектрической нивелировки корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
# Каждый раз при выполнении нивелирования необходимо повторно выполнять операцию Z_TILT_ADJUST для получения новых корректировок.
# Если флаг установлен в значение ZDOWN, корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
  SET_G29_FLAG VALUE=1
  G28 Z
  BED_MESH_CLEAR
  NOZZLE_CLEAR
  M104 S{extruder_temp}
  M190 S80
  M109 S{extruder_temp}
  # После тщательной очистки сопла выполняется фотоэлектрическое выравнивание для получения максимального значения высоты по оси Z.
  ZDOWN_SWITCH ENABLE=1
  G28 Z
  BED_MESH_CLEAR
  Z_TILT_ADJUST WAITTIME=5
  NEXT_HOMEZ_NACCU
  G28 Z
  SET_G29_FLAG VALUE=0

  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE {get_count}
  G1 Z175 F1200
  BOX_MOVE_TO_SAFE_POS
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=80degrees
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}


[gcode_macro BED_MESH_100]
description: картирование стола с температурой 100
gcode:
  M140 S100
  {% if 'PROBE_COUNT' in params|upper %}
    {% set get_count = ('PROBE_COUNT' + params.PROBE_COUNT) %}
  {%else %}
    {% set get_count = "" %}
  {% endif %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set nozzle_clear_temp = printer.custom_macro.default_extruder_temp %}
  {% if 'EXTRUDER_TEMP' in params|upper %}
    {% set nozzle_clear_temp = params.EXTRUDER_TEMP %}
  {% endif %}
  {% set enabled = printer["filament_switch_sensor filament_sensor"].enabled %}
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  M104 S{extruder_temp}
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
# Здесь для возврата в исходное положение необходимо опустить ось Z. После этой фотоэлектрической нивелировки корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
# Каждый раз при выполнении нивелирования необходимо повторно выполнять операцию Z_TILT_ADJUST для получения новых корректировок.
# Если флаг установлен в значение ZDOWN, корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
  SET_G29_FLAG VALUE=1
  G28 Z
  BED_MESH_CLEAR
  NOZZLE_CLEAR
  M104 S{extruder_temp}
  M190 S100
  M109 S{extruder_temp}
  # После тщательной очистки сопла выполняется фотоэлектрическое выравнивание для получения максимального значения высоты по оси Z.
  ZDOWN_SWITCH ENABLE=1
  G28 Z
  BED_MESH_CLEAR
  Z_TILT_ADJUST WAITTIME=5
  NEXT_HOMEZ_NACCU
  G28 Z
  SET_G29_FLAG VALUE=0

  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE {get_count}
  G1 Z175 F1200
  BOX_MOVE_TO_SAFE_POS
  BED_MESH_PROFILE SAVE=100degrees
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}

