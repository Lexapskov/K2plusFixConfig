[gcode_macro HEATBED_GETLOWZ_SAFE]
description: Опускание стола в зависимости от текущей его высоты
gcode:
    {% set current_z = printer.toolhead.position.z %}
    
    # Если сопло ниже 298 мм - поднимаем до 300 мм
    {% if current_z < 298 %}
        G90                    # Абсолютный режим
        G1 Z300 F1800          # Подъем до 300 мм со скоростью 1800 мм/мин
    
    # Если сопло от 298 до 345 мм - поднимаем на 5 мм
    {% elif current_z < 345 %}
        G91                    # Относительный режим
        G1 Z5 F1800            # Подъем на 5 мм
        G90                    # Возврат в абсолютный режим
    
    # Если сопло от 345 до 350 мм - поднимаем на 1 мм
    {% elif current_z < 350 %}
        G91                    # Относительный режим
        G1 Z1 F1800            # Подъем на 1 мм
        G90                    # Возврат в абсолютный режим
    
    # Если сопло >= 350 мм - ничего не делаем
    {% else %}
        # Ничего не делаем
    {% endif %}


[gcode_macro NOZZLE_CLEANPARKING]
description: быстро почистить сопло стряхнув какушки и запарковать на пластинку
gcode:
    # Проверяем, определены ли оси X и Y
    {% if not printer.toolhead.homed_axes or 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 Y
        G28 X
    {% endif %}
    #BOX_NOZZLE_CLEAN #заводская команда подскочить к лотку, пошоркать соплом о щётки стряхивая какушки и выскочить обратно
    BOX_NOZZLE_CLEANPLUS # версия команды для латунной щетки
    BOX_GO_TO_EXTRUDE_POS #встать в лоток
    G1 X152 F3000 #заезжаем на пластинку, чтоб пластик не стекал (поиграйте стрелками с экранчика, чтоб уточнить координаты своей пластинки)


