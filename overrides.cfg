[gcode_macro NOZZLE_PID_300]
description: PID хотенда для 300"
gcode:
  {action_respond_info("Nozzle heatpider...")}
  SET_PIN PIN=fan0 VALUE=255
  PID_CALIBRATE HEATER=extruder TARGET=300 #230 (выставьте ту температуру на которой чаще печатаете)
  SAVE_CONFIG
  SET_PIN PIN=fan0 VALUE=0


