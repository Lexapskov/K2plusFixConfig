gcode:
 {% set EXTRUDER_WAITTEMP = printer.custom_macro.g28_ext_temp %} # Температура сопла для G28 из пользовательских настроек
 {% set EXTRUDER_TEMP = printer.custom_macro.default_extruder_temp %} # Температура сопла по умолчанию
 SAVE_GCODE_STATE NAME=myMoveState # Сохраняем текущее состояние позиции и экструдера
 BOX_GO_TO_EXTRUDE_POS # Перемещаем голову в позицию для выдавливания какульника
 FILAMENT_RACK_SAVE_FAN # Сохраняем текущее состояние вентилятора
 #FILAMENT_RACK_PRE_FLUSH # Выполняем предварительную продувку/прочистку филамента
 #FILAMENT_RACK_SET_TEMP # Устанавливаем температуру для филамента
 SET_PIN PIN=fan0 VALUE=128 # Устанавливаем обороты вентилятора обдува на 50% (128/255)
 M109 S200 # Устанавливаем целевую температуру сопла
 #SET_COOL_TEMP # Устанавливаем температуру охлаждения 
 M104 S{EXTRUDER_WAITTEMP} # намечаем температур сопла для занулений
 SOFT_NOZZLE_CLEAN # Очистка сопла о латунную щетку без стука и возврат на исходную позицию
 BOX_GO_TO_EXTRUDE_POS
 G1 X185 Y355 # Быстрое перемещение на гладкий участок пеи пластины
 G0 Z-0.1 F600 # Прижимаем сопло к столу с умеренной скоростью
 SET_PIN PIN=fan0 VALUE=255 # Включаем вентилятор на полную мощность (100%)
 M109 S{EXTRUDER_WAITTEMP} # Ждём достижения температуры сопла для занулений
 G0 Z5 F1000 # Поднимаем сопло на 5 мм для безопасного движения
 SET_PIN PIN=fan0 VALUE=0 # Выключаем вентилятор обдува
 FILAMENT_RACK_RESTORE_FAN # Восстанавливаем сохранённое состояние вентилятора
 BOX_MOVE_TO_SAFE_POS # Перемещаем голову в безопасную парковочную позицию
 RESTORE_GCODE_STATE NAME=myMoveState # Восстанавливаем исходное состояние позиции и экструдера


# Если вам нужен расчет и применение Z-offset на основе температуры, усадки материала и толщины первого слоя
# В слайсере/настройки принтера самый конец стартового G-коде добавьте: SET_ZOFFSET FIRST_LAYER_HEIGHT=[first_layer_height] FILAMENT_SHRINK=[filament_shrink] NOZZLE_TEMPERATURE_INITIAL_LAYER=[nozzle_temperature_initial_layer]
[gcode_macro SET_ZOFFSET]
description: Установка Z offset с учетом усадки материала
gcode:
    # Получаем параметры из слайсера
    {% set first_layer_height = params.FIRST_LAYER_HEIGHT|default(0.2)|float %}
    {% set filament_shrink_raw = params.FILAMENT_SHRINK|default("0") %}
    {% set nozzle_temp = params.NOZZLE_TEMPERATURE_INITIAL_LAYER|default(220)|float %}
    
    {% set filament_shrink = filament_shrink_raw|replace("%", "")|float %} # Очищаем от символа % и преобразуем в число
    {% set shrink_factor = (100.8 - filament_shrink) %} # Рассчитываем коэффициент усадки
    {% set z_offset = first_layer_height * shrink_factor * (nozzle_temp - 140) * 0.00167 %}  # Рассчитываем компенсацию Z offset
    {% set z_offset = (z_offset / 0.005)|round(0) * 0.005 %}  # Округляем до ближайшего шага 0.005
    
    # Устанавливаем Z-offset только если значение > 0
    {% if z_offset > 0 %}
        SET_GCODE_OFFSET Z={z_offset} MOVE=1
        RESPOND MSG=" Z-OFFSET: {z_offset} по усадке и температуре УСТАНОВЛЕН "
        M117 Z-Offset: {z_offset}mm
    {% else %}
        { action_respond_info(" {0} * {1} * {2} = {3} мм | Z-Offset НЕ УСТАНОВЛЕН (значение <= 0)".format(first_layer_height, shrink_factor, nozzle_temp * 0.01, z_offset)) }
    {% endif %}
# ALT_Z_OFFSET T=params.NOZZLE_TEMPERATURE_INITIAL_LAYER # раскомментируйте(уберите значок # в самом начале строки) эту строку, чтобы использовать Альтернативный вариант
# Расчет и применение Z-offset на основе температуры и примерной оценки состояния сопла, если вышеизложенные корректировки не подходит
[gcode_macro ALT_Z_OFFSET]
description: Nozzle temperature based Z-offset
gcode:
    {% set plotnost_vstavki = 8 %} #оценка плотности посадки твердой вставки в медном уникорне при разогреве сопла, определяется эмпирически чем хуже состояние вставки тем меньше значение 10-0 (можно использовать и отрицательные, но это повод заменить сопло или проверить надежность креплений
    {% set T = params.T|default(0)|float %}
  {% if T == 0 %}
        RESPOND MSG="ALT_Z_OFFSET: Нет данных о температуре сопла" # Если температура не передана или 0 - выходим
  {% else %}
      {% set delta_L = 0.0006706 * (T - 140) - plotnost_vstavki * 0.006 %}       # Рассчитываем удлинение по формуле ΔL = 0.0006706 * (T - 140)
      {% set z_offset = delta_L | round(2) %}     # Округляем до 2х знаков после запятой
      {% if z_offset > 0 %} # Если значение положительное - применяем
        SET_GCODE_OFFSET Z={z_offset} MOVE=1
        RESPOND MSG="установлен Z-offset: {z_offset} мм для {T}°C по люфту"
      {% else %}
        RESPOND MSG="Z-offset не изменился"
      {% endif %}
  {% endif %}


#нижеследующие макросы кастомные, с ними делать ничего не надо, можно просто использовать вызывая из консоли флюидд

[gcode_macro BED_MESH_80]
description: картирование стола и сохранение с температурой 80
gcode:
  M140 S80
  {% if 'PROBE_COUNT' in params|upper %}
    {% set get_count = ('PROBE_COUNT' + params.PROBE_COUNT) %}
  {%else %}
    {% set get_count = "" %}
  {% endif %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set nozzle_clear_temp = printer.custom_macro.default_extruder_temp %}
  {% if 'EXTRUDER_TEMP' in params|upper %}
    {% set nozzle_clear_temp = params.EXTRUDER_TEMP %}
  {% endif %}
  {% set enabled = printer["filament_switch_sensor filament_sensor"].enabled %}
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  M104 S{extruder_temp}
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
# Здесь для возврата в исходное положение необходимо опустить ось Z. После этой фотоэлектрической нивелировки корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
# Каждый раз при выполнении нивелирования необходимо повторно выполнять операцию Z_TILT_ADJUST для получения новых корректировок.
# Если флаг установлен в значение ZDOWN, корректировки, записанные в предыдущей операции Z_TILT_ADJUST, не будут восстановлены.
  SET_G29_FLAG VALUE=1
  G28 Z
  BED_MESH_CLEAR
  NOZZLE_CLEAR
  M104 S{extruder_temp}
  M190 S80
  M109 S{extruder_temp}
  # После тщательной очистки сопла выполняется фотоэлектрическое выравнивание для получения максимального значения высоты по оси Z.
  ZDOWN_SWITCH ENABLE=1
  G28 Z
  BED_MESH_CLEAR
  Z_TILT_ADJUST WAITTIME=5
  NEXT_HOMEZ_NACCU
  G28 Z
  SET_G29_FLAG VALUE=0

  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE {get_count}
  G1 Z175 F1200
  BOX_MOVE_TO_SAFE_POS
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=80degrees
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  {% if enabled %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}


