[gcode_macro HEATBED_GETLOWZ_SAFE]
description: Опускание стола в зависимости от текущей его высоты
gcode:
    {% set current_z = printer.toolhead.position.z %}
    
    # Если сопло ниже 298 мм - поднимаем до 300 мм
    {% if current_z < 298 %}
        G90                    # Абсолютный режим
        G1 Z300 F1800          # Подъем до 300 мм со скоростью 1800 мм/мин
    
    # Если сопло от 298 до 345 мм - поднимаем на 5 мм
    {% elif current_z < 345 %}
        G91                    # Относительный режим
        G1 Z5 F1800            # Подъем на 5 мм
        G90                    # Возврат в абсолютный режим
    
    # Если сопло от 345 до 350 мм - поднимаем на 1 мм
    {% elif current_z < 350 %}
        G91                    # Относительный режим
        G1 Z1 F1800            # Подъем на 1 мм
        G90                    # Возврат в абсолютный режим
    
    # Если сопло >= 350 мм - ничего не делаем
    {% else %}
        # Ничего не делаем
    {% endif %}


[gcode_macro NOZZLE_CLEANPARKING]
description: почистить сопло и запарковать на пластинку
gcode:
    BOX_NOZZLE_CLEAN #пошоркать соплом о щётку
    BOX_GO_TO_EXTRUDE_POS #паркуемся в лоток
    G1 X151 F3000 #заезжаем на пластинку, чтоб пластик не стекал


#нижеследующий код можно удалить если Вы не настраивали публикацию конфигов на GitHub
[gcode_macro OVERIDESBACKUP]
description: выгрузить конфиги на Гитхаб
gcode:
    {action_respond_info("Starting backup of selected config files to GitHub...")}
    RUN_SHELL_COMMAND CMD=myoverridesbackup
    {action_respond_info("Config files saved to GitHub successfully!")}

[gcode_shell_command myoverridesbackup]
command: /bin/ash /mnt/UDISK/printer_data/config/myoverridesbackup.sh
timeout: 30.
verbose: True