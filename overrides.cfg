#нижеследующие строки меняют параметры принтера на оптимизированные при загрузке принтера
#приходится брать все блоки целиком иначе остальные данные могут пропадать(меняться на клиперодефолт)
# из printer.cfg
[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.2
position_min: -6.2
position_max: 384 # 400по заводу , но это уже сильно за стеной какосброса, можно определить стрелками с экранчика после выполнения макроса NOZZLE_CLEANPARKING
homing_speed: 100
homing_retract_dist: 10

[prtouch_v3]
z_offset: 0 # базовое смещение сопла (Z-offset)
speed: 5 # скорость перемещения при зондировании (мм/с)
quick_lift_speed:100 # скорость быстрого подъёма щупа после касания (мм/с)
samples: 2 #1 увеличил количество измерений для усреднения определения Z-offset
samples_result: average # метод обработки результатов измерений (среднее арифметическое)
samples_tolerance_retries: 7 #5 количество повторных попыток при превышении допуска
samples_tolerance: 0.03 #0.5 допустимую погрешность определения Z-offset установим 1 сотую вместо полумиллиметра, если после прогрева камеры случаются ошибки, то увеличиваем значение вплоть до 0.05
prth_clr_probe_pos:175,355 # позиция (X,Y) для очистки щупа перед измерением
step_swap_pin: !PC7 # пин для смены шагового драйвера (инвертированный)
pres_swap_pin: nozzle_mcu:PA15 # пин для смены режима тензодатчика (на плате nozzle_mcu)

prth_msg_show: False #True спам в консоль от тензодатчика
#prth_dbg_ippt: 172.21.20.205 # IP-адрес для отладки (закомментировано)
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14 # пины Chip Select для тензодатчика (CS0)
pres_tri_hold:4000, 10000, 500  # параметры удержания триггера: время, задержка, период (мкс)
# prth_tmp_comp: 26,300,0,0.135 # по умолчанию используется нелинейная температурная компенсация, 26,300,0,0.11 для варианта с тензодатчиком 2.5мм без утонения + повышение напряжения возбуждения #26,300,0,0.135 для утонённого тензодатчика
enable_not_linear_comp:True # включить нелинейную температурную компенсацию, True — включить, False — выключить (использовать линейную компенсацию)
pres_cfg_regs:60 #60 (1280/128) 44 (640/128) 56 (1280/64)
# prth_gas_calr:0.001 # квадратный корень из стандартного отклонения фильтра Гаусса, 0.001 ~ 10, чем меньше значение, тем слабее программа сглаживания сетки стола, закомментировано — выключено
prth_max_chps:8 # максимальное количество "отскоков" (chirps) при измерении
prth_tri_zacc:1000 # ускорение при подъёме по Z (мм/с²)
prth_min_fans:0.6 # минимальная скорость вентиляторов для стабилизации температуры
# regional_prtouch_switch: False # переключатель зонального выравнивания, по умолчанию True (включено)
# regional_prtouch_percentage:0.8
high_low_temp_leveling:True # включение компенсации при высоких/низких температурах
bed_mesh_fall_comp_diagonal: -0.045, -0.045, -0.025, -0.025, -0.02
bed_mesh_fall_comp_axis:-0.055, -0.055, -0.035, 0, 0, 0, -0.025, -0.025, -0.035
# bed_mesh_add_comp: 0.035, 0.020, 0
# horizontal_move_z_quick: 1 # мм высота подъёма при зондировании
need_steady_regional:0.8 # необходимая стабильная зона стола

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes
forced_leveling: false #true полностью отключаем автокартирование для каждой печати


[bed_mesh]
speed: 500 #100 ускоряем холостые перемещения при снятии карты стола
mesh_min: 5,5  # минимальные координаты (X,Y) области сканирования стола (мм)
mesh_max: 345,345 # максимальные координаты (X,Y) области сканирования стола (мм)
probe_count:9,9 # количество точек зондирования по осям X и Y (9x9 = 81 точка)
mesh_pps: 2, 2 # количество интерполяционных точек между измеренными (Points Per Segment)
fade_start: 5.0 # высота (мм), на которой начинается затухание компенсации неровностей стола
fade_end: 50.0  #высота (мм), на которой компенсация полностью отключается (затухает до нуля)
bicubic_tension: 0.2 # коэффициент натяжения для бикубической интерполяции (0 - мягкая, 1 - жёсткая)
algorithm: bicubic # алгоритм интерполяции сетки (bicubic - бикубическая интерполяция)
horizontal_move_z:3 #5 # высота подъёма сопла при перемещении между точками зондирования (мм)
split_delta_z: 0.01  # максимальное отклонение по Z для разделения сегмента при интерполяции (мм)
move_check_distance: 1  # расстояние (мм) между проверками при движении (контроль столкновений значений)


[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance:1000.0
step_pin:nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin:!nozzle_mcu:PB2
microsteps:16
rotation_distance:6.9
nozzle_diameter:0.400
filament_diameter:1.750
heater_pin:nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin:nozzle_mcu:PA0
pressure_advance: 0.042
pressure_advance_smooth_time: 0.03 #0.038 милисек время рекации для pressure_advance, чем меньше тем больше нагрузка на операционную систему и экструдер, но короче участки срабатывания корректировки, но для длинного горла слишком короткое ыьщщер time приводит к тому что кусок филамента работает как пружина, особенно в спецефических горлах уникорн с их длинными конусами вместо цилиндрических отверстий.
                                    # выяснилось что принтер грузит его отсюда 1 раз а далее при вызове переменной pressure_advance_smooth_time - он её просто стирает , и берёт значение из оперативки куда новое оно может попадает их своих закрытых недр... в общем ниже хардкодом поставлю 0,02
#p_advance_smooth_time: 0.025 # обхитрить клиппер создав левую переменную в этой скции не прокатило
#control:pid
#pid_kp: 14.296
#pid_ki: 1.271
#pid_kd: 40.206
high_temp_value: 280
pid_kp_high_temp: 16.443
pid_ki_high_temp:  1.370
pid_kd_high_temp: 49.329
min_temp:-30# 0  20240326
max_temp:390

# из box.cfg
[box]
bus:serial485
filament_sensor:filament_sensor
pre_cut_pos_x: 10           # позиция предварительного подвода ножа, обеспечивает вертикальный рез
pre_cut_pos_y: 300 #200 исходная препозиция для резки филамента, 300 чтоб не ездил далеко от какосброса
#cut_pos_x: -6.5    
cut_pos_y: 300 #200 позиция для резки филамента значение лучше ставить равным препозиции и не у самого края, чтоб вал мог "отыграть" удар
Tn_retrude: -10             # длина отвода филамента из экструзионной шестерни после резки
Tn_retrude_velocity: 600    # скорость ретракта (отвода)
Tn_extrude_temp: 220        # температура экструзии
Tn_extrude: 140             # если установлена текущая температура, предварительный нагрев ножа до 120
Tn_extrude_velocity: 360    # скорость экструзии
buffer_empty_len: 30        # резервная длина для ретракта буфера, необходимая длина резерва в буфере экструдера (отрезок от ножа внутри экструдера до шестерни подачи)
clean_left_pos_x: 156 #135  # левая граница качания при выдувании филамента в лоток, у меня установлена координата левого края щётки чтоб при заводской чистке пластинку по реже ломало
clean_left_pos_y: 376 #378 по заводу ,а 376 мой центр пружинки
clean_right_pos_x: 179 #160 # правая граница качания при выдувании филамента в лоток. Правый край сопельной щётки (поставьте значение 162, если вы не устанавливали к штатной резиновой дополнительную латунную)
clean_right_pos_y: 378
clean_velocity: 12000        #Скорость очистки
box_need_clean_length:70
cut_velocity: 30000         #Скорость обрезки филамента
extrude_pos_x: 133          # позиция экструзии при смене филамента
extrude_pos_y: 376
has_extrude_pos: 1          # наличие необходимости выдувания (отличие K1_MAX от f008)
safe_pos_x: 179 #225 было ближе к центру зоны протирки на pei-пластие, 175 ближе к какосбросу -точные координаты своего принтера смотрите двигая голову стрелками на экранчике(можно поставить напротив латунной щётки)
safe_pos_y: 348 #345 позаводу (350 делать нельзя т.к. точка иногда используется и при смене филамента)
clean_pos_left_x: 157 #160       # левая граница координат для протирки сопла о силикон (у меня латунь)
clean_pos_right_x:179#170       # правая граница координат для протирки сопла о силикон (у меня латунь)
clean_pos_middle_y:374      # средняя координата Y для протирки сопла о силикон
pre_cut_cal_pos_x:-7       # позиция калибровки предварительного реза, уменьшает время калибровки
check_cut_pos_x_max: -5.5   # максимальное значение калибровки ножа
check_cut_pos_x_min: -9.5   # минимальное значение калибровки ножа
switch_pin:!nozzle_mcu:PB9
version: 1

#из printer_param.cfg
[custom_macro]
default_bed_temp: 70 #50 температура стола "по умолчанию" для картирования стола и зануления
default_extruder_temp: 230 #220 температура сопла "по умолчанию" для очистки сопла 
g28_ext_temp: 140

#вот это надо скопировать и цело вставить в конец gcode_macro.cfg потомучто без этого переопределения прошивка тупит сохраняя с перезагрузкой PID или карту стола запущенную из fluidd
[gcode_macro SAVE_CONFIG]
rename_existing: SAVE_CONFIG_BASE  # просто переопределяем оригинальную команду
gcode:
    {action_respond_info("Nozzle heatpiderasting")}
    SAVE_CONFIG_BASE               # Вызываем оригинальную встроенную команду
    {action_respond_info("Configuration saved, restarting...")}



# нижеследующие макросы после обновления прошивки придётся руками сравнивать на необходимость переносов в gcodemacro.cfg
[gcode_macro START_PRINT] # Основной макрос начала печати
variable_prepare: 0 # Переменная для отслеживания состояния подготовки (0 - не готово, 1 - готово)
gcode:
  # ВКЛЮЧАЕМ ВЕНТИЛЯТОР КАМЕРЫ, ЕСЛИ задана ТЕМПЕРАТУРА > 40°C
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|int %} # получаем значение если оно передано из слайсера
  {% if CHAMBER_TEMP > 40 %}
    M106 P1 S255 F1
    {action_respond_info("Chamber fan ON (set temp %s )" % (CHAMBER_TEMP))}
  {% else %}
    M106 P1 S0 F1
    {action_respond_info("Chamber fan OFF (set temp <= 40°C)")}
  {% endif %}
  M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
  M140 S{params.BED_TEMP} # Установка температуры стола (без ожидания)
  BOX_START_PRINT # Связь с CFS протяжка прутка... вроде
  G90 # Установка абсолютного позиционирования
  SET_GCODE_OFFSET Z=0 # Сброс смещения по оси Z
  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %} # Температура сопла для G28 из пользовательских настроек
  {% set bed_temp = printer.custom_macro.default_bed_temp %} # Температура стола по умолчанию
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %} # Температура сопла по умолчанию
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %} # Температура стола из параметров (по умолчанию 60°C)
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %} # Температура сопла из параметров (по умолчанию 220°C)
  {% set EXTRUDER_WAITTEMP = (140.0|float)|int %} # Фиксированная промежуточная температура 140°C для предварительного нагрева
  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %} # Если подготовка ещё не выполнена

    {action_respond_info("print params prepared 111")} # Отправка информационного сообщения в интерфейс
    
    M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
    M140 S{params.BED_TEMP} # Установка температуры стола (без ожидания)
    M104 S{EXTRUDER_WAITTEMP} # Установка промежуточной температуры сопла 140°C (без ожидания)
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000 # Ограничение ускорения и замедления до 5000 мм/с²
    G28 # Выполнение полной гоминга (все оси в нулевую позицию)
    #NOZZLE_CLEAR # грубая Очистка сопла от остатков пластика об стол
    M104 S{EXTRUDER_WAITTEMP} # Повторная установка промежуточной температуры 140°C
    M190 S{params.BED_TEMP} # Ожидание достижения температуры стола
    M109 S{EXTRUDER_WAITTEMP} # Ожидание достижения промежуточной температуры сопла 140°C
    SOFT_NOZZLE_CLEAN # Очистка сопла о латунную щетку без стука
    NOZZLE_CLEAR # очистка сопла с охлаждением уперевшись в пластину
    #NEXT_HOMEZ_NACCU # Точная калибровка оси Z с датчиком
    G28 Z # Повторная гоминг оси Z для точной установки нуля
  {% else %} # Иначе (если подготовка уже выполнена)
    PRINT_PREPARE_CLEAR # Очистка состояния подготовки для повторного использования
  {% endif %} # Конец условия проверки подготовки
  # dsgjkytybt начинается только отсюда, всё что выше, как не комментируй условия и не передвигай команды, просто игнорируется
  M140 S{params.BED_TEMP} # Установка финальной температуры стола
  M104 S{params.EXTRUDER_TEMP} # Установка финальной температуры сопла (рабочей)
  M141 S{params.CHAMBER_TEMP} # установка температуры камеры без ожидания
  BOX_GO_TO_EXTRUDE_POS # Перемещение в позицию для выдавливания
  M190 S{params.BED_TEMP} # Ожидание достижения финальной температуры стола
  M109 S{params.EXTRUDER_TEMP} # Ожидание достижения финальной температуры сопла
  M220 S100 # Сброс множителя скорости подачи до 100%
  # M221 S100 # Сброс множителя потока (закомментировано)
  G21 # Установка единиц измерения в миллиметры (безопасность)
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10 # Ограничение скорости прохождения углов до 10 мм/с
  M204 S5000 # Установка ускорения по умолчанию 5000 мм/с²
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000 # Ограничение замедления до 5000 мм/с²
  SOFT_NOZZLE_CLEAN # Очистка сопла о латунную щетку без стука и возврат на исходную позицию
  G92 E0 # Сброс счётчика экструдера (обнуление длины филамента)
  SET_PIN PIN=extruder_fan VALUE=1 # Включение вентилятора радиатора хотэнда
  #SET_TEMPERATURE_FAN_SWITCH TEMPERATURE_FAN=chamber_fan VALUE=1 # Включение вентилятора камеры (закомментировано)
  BED_MESH_TLOAD BED_TEMP={params.BED_TEMP}  # ВЫЗОВ МАКРОСА для выбора карты стола по его температуре
  SET_GCODE_OFFSET Z=0.01 MOVE=1 # Установка микросмещения по Z


[gcode_macro END_PRINT]
gcode:
  G91
  G1 E-0.6 F5400
  G1 Z2 Y2 F3600
  G90
  #END_PRINT_Z_SAFE # опускаем стол на 2мм если есть такая возможность и ставимся в какульник
  BOX_GO_TO_EXTRUDE_POS # ставимся в какульник
  BOX_NOZZLE_CLEAN # быстрая очистка сопла с грохотом крышкой какульника вместо звукового оповещения о финале печати
  G92 E-2.4 F600
  RESTORE_LIMITS
  #END_PRINT_POINT #стол опускается до середины камеры
  ENABLE_PRESSURE_ADVANCE VALUE=1
  M400
  BOX_END #втягивание филамента
  BOX_END_PRINT #втягивание филамента
  Qmode_exit
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  M220 S100 # множитель скорости печати на 100%
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
  TURN_OFF_HEATERS
  M107 P1
  M107 P2
  BOX_GO_TO_EXTRUDE_POS #паркуемся в лоток
  M106 P0 S127 F1 #дуем на сопло
  #WAIT_TEMP_START
  NOZZLE_CLEANPARKING #очистка c парковкой на пружинке
  HEATBED_GETLOWZ_SAFE #опускаем стол до 300мм или ниже
  M106 P0 S0 F1 #выключаем обдув сопла


[gcode_macro END_PRINT_Z_SAFE] # опускаем стол на 2мм если есть такая возможность и ставимся в какульник
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    G91
    {action_respond_info("END_PRINT_Z_SAFE act_z:%s, max_z:%s \n" % (act_z, max_z))}
    {% if act_z < (max_z - 5) %}
        {action_respond_info("END_PRINT_Z_SAFE G1 Z2.0 F1800 \n")}
        G1 Z2.0 F1800 #600
        BOX_GO_TO_EXTRUDE_POS
    {% endif %}
    G90
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro BED_MESH_TLOAD]
description: Загрузка профиля стола в зависимости от температуры
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    
    # Определяем профиль
    {% if BED_TEMP >= 90 %}
        {% set PROFILE = "100degrees" %}
    {% elif BED_TEMP >= 80 and BED_TEMP < 90 %}
        {% set PROFILE = "80degrees" %}
    {% else %}
        {% set PROFILE = "default" %}
    {% endif %}
    
    # Проверяем, существует ли профиль (подавляем ошибку, если нет)
    {% set PROFILES = printer.bed_mesh.profiles %}
    {% if PROFILE in PROFILES %}
        BED_MESH_PROFILE LOAD={PROFILE}
         {action_respond_info("Bedmesh: {PROFILE} loaded for: {BED_TEMP}C")}
    {% else %}
        RESPOND TYPE=command MSG="⚠️ Профиль {PROFILE} не найден! Используется калибровка по умолчанию."
        # Опционально: выполнить калибровку вместо загрузки
        # BED_MESH_CALIBRATE
    {% endif %}


[gcode_macro SET_PRESSURE_ADVANCE] # переопределяем штатный макрос, чтобы смузтайм устанавливавлось из конфига, а не из облака в принтере (если облако устраивает, то поставить любую лишнюю букву в названии этого макроса)
description: Set pressure advance with optional smooth time
rename_existing: _SET_PRESSURE_ADVANCE 
gcode:
    {% set advance = params.ADVANCE|default(None) %}
    {% set smooth_time = params.SMOOTH_TIME|default(None) %}
    {% set default_smooth = printer.extruder.pressure_advance_smooth_time|default(0.030) %} # загружаем значение по умолчанию из настроек секция экструдер НЕ прокатывает дефолт прийдется задавать тут
    {% set default_advance = printer.extruder.pressure_advance|default(0.045) %} # загружаем значение по умолчанию
  
    {% if advance is not none and smooth_time is not none %} # Оба параметра заданы - устанавливаем оба  
        _SET_PRESSURE_ADVANCE ADVANCE={advance} SMOOTH_TIME={smooth_time}

    {% elif advance is not none and smooth_time is none %} # Задан только ADVANCE - используем smooth_time из сохраненной переменной
        _SET_PRESSURE_ADVANCE ADVANCE={advance} SMOOTH_TIME={default_smooth}

    {% elif advance is none and smooth_time is not none %}  # Задан только SMOOTH_TIME - устанавливаем только его
        _SET_PRESSURE_ADVANCE SMOOTH_TIME={smooth_time}
    {% else %} # Ни один параметр не задан - выводим текущие значения из оперативной памяти
        _SET_PRESSURE_ADVANCE
    {% endif %}

# макрос на основе совета от Zz
[gcode_macro SOFT_NOZZLE_CLEAN] # Очистка сопла о латунную щетку без стука с возвратом на исходную позицию
#rename_existing: BOX_NOZZLE_CLEAN # Переименовываем заводской макрос
gcode:
    SAVE_GCODE_STATE NAME=myMoveState # Сохраняем текущее состояние позиции и экструдера
    BOX_GO_TO_EXTRUDE_POS # Перемещаем голову в какульник
   G0 X175 Y375 F10000 # Быстрое перемещение в центр чистящей щётки #координаты определять стрелочками с экранчика после макроса BOX_NOZZLE_CLEANPARKING
   {% for BrushingRounds in range(4) %} # Цикл очистки из 4 повторений
     G2 J3 F9000 # Дуга по часовой стрелке радиусом 6мм (очистка правой стороны)
     G3 J-3 F9000 # Дуга против часовой стрелки радиусом 6мм (очистка левой стороны)
     G3 I-3 F12000 # Дуга против часовой стрелки со смещением центра влево на 6мм
     G2 I3 F12000 # Дуга по часовой стрелке со смещением центра вправо на 6мм
   {% endfor %} # Конец цикла очистки
   #BOX_NOZZLE_CLEAN # Вызов заводской процедуры быстрой очистки для сброса какушек и завершения в типичных для завода координатах
   RESTORE_GCODE_STATE NAME=myMoveState # Восстанавливаем исходное состояние позиции и экструдера

#переопределение штатного макроса по совету Zz
[gcode_macro NOZZLE_CLEAR]
