    {% if not printer.toolhead.homed_axes or 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        G28 Y
        G28 X
    {% endif %}
    #BOX_NOZZLE_CLEAN #заводская команда подскочить к лотку, пошоркать соплом о щётки стуком стряхивая какушки и выскочить обратно
    SOFT_NOZZLE_CLEAN # Очистка сопла о латунную щетку без стука # версия команды для латунной щетки
    BOX_GO_TO_EXTRUDE_POS #встать в лоток
    G1 X152 F3000 #заезжаем на пластинку, чтоб пластик не стекал (поиграйте стрелками с экранчика, чтоб уточнить координаты своей пластинки)


